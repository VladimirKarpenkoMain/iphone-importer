[package]
name = "iphone-importer"
version = "0.1.0"
edition = "2024"

[dependencies]
idevice = { version = "0.1.68", default-features = false, features = ["rustcrypto", "usbmuxd", "afc"] }
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
